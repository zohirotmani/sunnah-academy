<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>دخول الطالب</title><link rel="stylesheet" href="/css/style.css"><link rel="icon" type="image/png" href="/images/sunnah-favicon.png"></head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">❈</span><span><strong>أكاديمية السنة</strong><small>دخول الطالب</small></span></a><nav class="main-nav">
  <a href="/">الرئيسية</a>
  <a href="/levels.html">المسار العلمي</a>
  <a href="/library.html">المكتبة</a>
  <a href="/scholars.html">العلماء</a>
  <a href="/tests.html">الاختبارات</a>
  <a href="/dashboard.html">لوحة الطالب</a>
  <a class="admin-link" href="/admin">الإدارة</a>
</nav></div></header>
<main class="page-shell"><div class="container auth-shell">
<div class="auth-card"><div class="bismillah small">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</div><span class="eyebrow">الطالب</span><h1>تسجيل الدخول</h1>
<form id="loginForm" class="form-grid"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="btn primary" type="submit">دخول</button><div id="msg"></div></form>
<p class="auth-foot">ليس لديك حساب؟ <a href="/register.html" class="text-link">أنشئ حسابًا</a></p></div>
</div></main>
<footer class="site-footer"><div class="container footer-inner"><div class="footer-brand">أكاديمية السنة</div><div class="footer-credit">زهير بن عمرو أبو معاذ</div></div></footer>
<script>
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok){document.getElementById("msg").textContent=d.error;return}location.href=(d.user && d.user.role === "admin") ? "/admin" : "/dashboard.html"});
</script></body></html>
