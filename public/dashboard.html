<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة الطالب - أكاديمية السنة</title><link rel="stylesheet" href="/css/style.css"><link rel="icon" type="image/png" href="/images/sunnah-favicon.png"></head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">❈</span><span><strong>أكاديمية السنة</strong><small>لوحة الطالب</small></span></a><nav class="main-nav">
  <a href="/">الرئيسية</a>
  <a href="/levels.html">المسار العلمي</a>
  <a href="/library.html">المكتبة</a>
  <a href="/scholars.html">العلماء</a>
  <a href="/tests.html">الاختبارات</a>
  <a href="/dashboard.html">لوحة الطالب</a>
  <a class="admin-link" href="/admin">الإدارة</a>
</nav></div></header>
<main class="page-shell"><div class="container">
<div id="studentHead" class="dashboard-head"></div>
<div class="dashboard-grid">
<section class="dash-panel wide"><div class="section-head"><div><span class="eyebrow">متابعة</span><h2>أكمل من حيث توقفت</h2></div></div><div id="progressList"></div></section>
<section class="dash-panel"><span class="eyebrow">المستوى الحالي</span><div id="levelBox" class="level-box"></div></section>
<section class="dash-panel"><span class="eyebrow">الاختبارات الأخيرة</span><div id="attempts"></div><a class="text-link" href="/tests.html">عرض الاختبارات ←</a></section>
</div></div></main>
<footer class="site-footer"><div class="container footer-inner"><div class="footer-brand">أكاديمية السنة</div><div class="footer-credit">زهير بن عمرو أبو معاذ</div></div></footer>
<script>
async function getData(){const r=await fetch("/api/student/dashboard");if(r.status===401){location.href="/login.html";return null}return r.json()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
(async()=>{const d=await getData();if(!d)return;
document.getElementById("studentHead").innerHTML=`<div class="eyebrow">مرحبًا بك</div><h1>${esc(d.user.name)}</h1><p>تابع مسارك العلمي، وراجع نتائج اختباراتك، وأكمل قراءتك من حيث توقفت.</p>`;
document.getElementById("levelBox").innerHTML=d.level?`<h2>${esc(d.level.name)}</h2><p>${esc(d.level.description||"")}</p>`:"<p>لم تحدد مستوى بعد.</p>";
const list=document.getElementById("progressList");
list.innerHTML=d.progress.length?d.progress.map(p=>{const pct=p.page_count?Math.min(100,Math.round(p.last_page/p.page_count*100)):0;return `<div class="progress-item"><div class="progress-row"><strong>${esc(p.title)}</strong><span>${p.last_page}${p.page_count?` / ${p.page_count}`:""} صفحة</span></div><div class="progress-track"><span style="width:${pct}%"></span></div><div class="progress-actions"><span>${pct}%</span><a class="text-link" href="/book.html?id=${p.book_id}">متابعة ←</a></div></div>`}).join(""):`<div class="empty">لم تبدأ قراءة أي كتاب بعد.</div>`;
document.getElementById("attempts").innerHTML=d.attempts.length?d.attempts.map(a=>`<div class="attempt"><strong>${esc(a.test_title)}</strong><span>${a.score}% — ${a.passed?"ناجح":"لم يجتز"}</span></div>`).join(""):`<p class="muted">لا توجد محاولات بعد.</p>`;
})();
document.getElementById("logout").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/"});
</script></body></html>
